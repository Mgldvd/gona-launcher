# Gona Launcher preset: Clean.
# One empty tile and the launcher's defaults, to build your own from nothing. Typing searches every
# installed app, and the all-apps button is in the strip, so apps are easy to find and add. The Fluid opening.
version = 1

[window]
width = 760
height = 460
effect = "fluid"
effect_ms = 600

[search]
all_apps = true

[buttons]
all_apps = true

[layout]
type = "leaf"
ids = []
